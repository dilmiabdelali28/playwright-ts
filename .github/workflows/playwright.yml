name: "🖥 :) ALL Tests : Execution"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5" # Every weekday at 2AM
  push:
    branches:
      - main

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  FEATURE: "all"
  ALLURE_VERSION: "2.19.0"
  EXECUTE_TYPE: "CI"
  # Branch used as the GitHub Pages source.
  PAGES_BRANCH: "gh-pages-all"
  # How many of the most recent reports to keep on the Pages branch.
  KEEP_REPORTS: "5"

# Ensures that only one deploy task per branch/environment will run at a time.
concurrency:
  group: environment-${{ github.ref }}-os
  cancel-in-progress: true

jobs:
  run-e2e-tests:
    runs-on: ubuntu-22.04
    name: "🕹️ Run E2E tests"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install && npx playwright install --with-deps

      - name: Play tests
        # env:
        #   AUTH_USER: ${{ secrets.AUTH_USER }}
        #   AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        #   RETRY_TEST_NUMBER: ${{ secrets.RETRY_TEST_NUMBER }}
        #   PARALLEL_SCENARIOS_NUMBER: 5
        #   SCENARIOS_NOTPARALLEL_EXECUTION: ${{ secrets.SCENARIOS_NOTPARALLEL_EXECUTION }}
        run: npm run test:smoke

      # Pull the current Pages branch: it holds every past run in a numbered
      # subfolder plus `last-history/` (the Allure trend carried between runs).
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: gh-pages

      - name: Build versioned report + dashboard
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          RUN="${{ github.run_number }}"
          BRANCH="${{ github.ref_name }}"
          DATE="$(date '+%Y-%m-%d %H:%M')"
          SHA_SHORT="${COMMIT_SHA:0:7}"
          COMMIT_SUBJECT="$(printf '%s' "$COMMIT_MSG" | head -n1)"

          # 1. Carry the Allure trend forward: feed the previous run's history
          #    back into the raw results so the new report keeps its curves.
          if [ -d gh-pages/last-history ]; then
            mkdir -p report/allure-results/history
            cp -r gh-pages/last-history/. report/allure-results/history/
          fi

          # 2. Turn the raw results (JSON) into the HTML report.
          npm run allure:generate   # -> report/allure-report

          # 3. Compute this run's stats and store them next to the report,
          #    so the dashboard can show status/counters per run.
          SUMMARY="report/allure-report/widgets/summary.json"
          if [ -f "$SUMMARY" ]; then
            PASSED=$(jq '.statistic.passed'  "$SUMMARY")
            FAILED=$(jq '.statistic.failed'  "$SUMMARY")
            BROKEN=$(jq '.statistic.broken'  "$SUMMARY")
            SKIPPED=$(jq '.statistic.skipped' "$SUMMARY")
            TOTAL=$(jq '.statistic.total'    "$SUMMARY")
          else
            PASSED=0; FAILED=0; BROKEN=0; SKIPPED=0; TOTAL=0
          fi
          FLAKY=$(find report/allure-results -name '*-result.json' -exec jq -r 'select(.flaky==true)|1' {} + 2>/dev/null | grep -c 1 || true)
          if [ "$((FAILED + BROKEN))" -gt 0 ]; then STATUS="failed"; else STATUS="passed"; fi
          jq -n \
            --arg run "$RUN" --arg branch "$BRANCH" --arg status "$STATUS" \
            --argjson passed "$PASSED" --argjson failed "$FAILED" --argjson broken "$BROKEN" \
            --argjson flaky "$FLAKY" --argjson skipped "$SKIPPED" --argjson total "$TOTAL" \
            --arg date "$DATE" --arg sha "$SHA_SHORT" --arg subject "$COMMIT_SUBJECT" \
            --arg pr "$PR_NUMBER" --arg repo "$REPO_URL" --arg runid "$RUN_ID" \
            '{run:$run,branch:$branch,status:$status,passed:$passed,failed:$failed,broken:$broken,flaky:$flaky,skipped:$skipped,total:$total,date:$date,sha:$sha,subject:$subject,pr:$pr,repo:$repo,runid:$runid}' \
            > report/allure-report/meta.json

          # 4. Assemble the full branch content in ./public (never copy .git).
          mkdir -p public
          if [ -d gh-pages ]; then
            find gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -r {} public/ \;
          fi
          # Add / replace this run's report under its own numbered folder,
          # and mirror it under the stable /latest/ URL.
          rm -rf "public/$RUN" public/latest
          cp -r report/allure-report "public/$RUN"
          cp -r report/allure-report public/latest
          # Refresh last-history for the next run's trend.
          rm -rf public/last-history
          mkdir -p public/last-history
          if [ -d report/allure-report/history ]; then
            cp -r report/allure-report/history/. public/last-history/
          fi

          # Keep only the N most recent reports (KEEP_REPORTS): delete older folders.
          ls -1 public | grep -E '^[0-9]+$' | sort -rn | tail -n +$(( KEEP_REPORTS + 1 )) | while read -r old; do
            rm -rf "public/$old"
          done

          # 5. Build the dashboard home page (hero + latest stats + history list).
          #    Hero uses THIS run's numbers; history cards read each run's meta.json.
          if [ "$((FAILED + BROKEN))" -gt 0 ]; then HERO_CLASS="has-failures"; HERO_TITLE="Failed run"; else HERO_CLASS="passing"; HERO_TITLE="Passed run"; fi
          HISTORY_ITEMS=""
          for d in $(ls -1 public | grep -E '^[0-9]+$' | sort -rn); do
            M="public/$d/meta.json"
            if [ -f "$M" ]; then
              st=$(jq -r '.status' "$M"); p=$(jq -r '.passed' "$M"); f=$(jq -r '.failed' "$M")
              b=$(jq -r '.broken' "$M"); fl=$(jq -r '.flaky' "$M"); br=$(jq -r '.branch' "$M"); dt=$(jq -r '.date' "$M")
              sha=$(jq -r '.sha // ""' "$M"); pr=$(jq -r '.pr // ""' "$M")
              if [ "$st" = "passed" ]; then ic="✅"; col="#16a34a"; else ic="❌"; col="#dc2626"; fi
            else
              ic="⬜"; col="#6b7280"; p="-"; f="-"; b="-"; fl="-"; br=""; dt=""; sha=""; pr=""
            fi
            SUB="$br${dt:+ · }$dt${sha:+ · commit }$sha${pr:+ · PR #}$pr"
            HISTORY_ITEMS="${HISTORY_ITEMS}<a href=\"./$d/\"><span class=\"h-left\"><span class=\"h-icon\">$ic</span><span class=\"h-info\"><span class=\"h-run\" style=\"color:$col\">Run #$d</span><span class=\"h-meta\">$SUB</span></span></span><span class=\"h-right\"><span class=\"h-stat passed\">$p passed</span><span class=\"h-stat failed\">$f failed</span><span class=\"h-stat broken\">$b broken</span><span class=\"h-stat flaky\">$fl flaky</span><span class=\"arrow\">→</span></span></a>"
          done

          cat > public/index.html <<HTMLEOF
          <!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
          <title>Playwright Reports</title>
          <style>
            *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
            .hero{background:linear-gradient(180deg,#a8c8f0 0%,#ccdff5 35%,#e8f1fb 65%,#f0f4f8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px 70px;text-align:center}
            .logo h1{font-size:2rem;color:#1a2340;font-weight:700}.logo .subtitle{color:#6b7a9a;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
            .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:32px 0}
            .pill{background:#fff;border-radius:20px;padding:8px 18px;font-size:.875rem;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.1)}
            .pill.passed{color:#16a34a}.pill.failed{color:#dc2626}.pill.flaky{color:#ea580c}.pill.broken{color:#d97706}.pill.total{color:#2563eb}
            .card-latest{background:rgba(255,255,255,.9);border-radius:14px;padding:26px 32px;text-decoration:none;max-width:480px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.1);display:block}
            .card-latest .icon{font-size:2rem;margin-bottom:10px}.card-latest h2{font-size:1.25rem;margin-bottom:6px}.card-latest h2.passing{color:#16a34a}.card-latest h2.has-failures{color:#dc2626}
            .card-latest .desc{color:#6b7280;font-size:.875rem}.card-latest .branch{color:#9ca3af;font-size:.8rem}
            .content{max-width:800px;margin:0 auto;padding:40px 20px;width:100%}
            .section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin-bottom:12px;font-weight:600}
            .history-list{display:flex;flex-direction:column;gap:6px}
            .history-list a{background:#fff;border-radius:8px;padding:14px 18px;text-decoration:none;color:#374151;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
            .h-left{display:flex;align-items:center;gap:12px}.h-icon{font-size:1.2rem}.h-info{display:flex;flex-direction:column;gap:2px}
            .h-run{font-size:.9rem;font-weight:600}.h-meta{font-size:.75rem;color:#9ca3af}.h-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
            .h-stat{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:10px}.h-stat.passed{background:#dcfce7;color:#16a34a}.h-stat.failed{background:#fee2e2;color:#dc2626}
            .h-stat.broken{background:#fef3c7;color:#d97706}.h-stat.flaky{background:#ffedd5;color:#ea580c}.arrow{color:#d1d5db;margin-left:8px}
            footer{background:#1a2340;color:#6b7a9a;padding:28px 20px;text-align:center;font-size:.85rem;margin-top:20px}
          </style></head><body>
            <div class="hero">
              <div class="logo"><h1>🎭 Playwright Reports</h1><div class="subtitle">E2E · SauceDemo</div></div>
              <div class="stats">
                <span class="pill passed">✅ $PASSED passed</span><span class="pill failed">❌ $FAILED failed</span>
                <span class="pill broken">💥 $BROKEN broken</span><span class="pill flaky">🔥 $FLAKY flaky</span><span class="pill total">📊 $TOTAL total</span>
              </div>
              <a href="./latest/" class="card-latest"><div class="icon">🚀</div><h2 class="$HERO_CLASS">$HERO_TITLE — Run #$RUN — résultats complets Allure</h2>
                <div class="desc">$COMMIT_SUBJECT</div><div class="branch">Branch: $BRANCH · commit $SHA_SHORT${PR_NUMBER:+ · PR #$PR_NUMBER} · $DATE</div></a>
            </div>
            <div class="content">
              <div class="section-title">Historique — $KEEP_REPORTS derniers runs</div>
              <div class="history-list">$HISTORY_ITEMS</div>
            </div>
            <footer>Playwright · GitHub Actions</footer>
          </body></html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: ${{ env.PAGES_BRANCH }}
          user_name: 'GitHub Actions'
          user_email: 'actions@github.com'
          commit_message: 'Deploy report for run #${{ github.run_number }}'
